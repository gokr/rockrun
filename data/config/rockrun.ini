; Rockrun - main ORX configuration
; Physics-driven Boulder Dash successor.

[Display]
Title           = Rockrun
ScreenWidth     = 1280
ScreenHeight    = 720
FullScreen      = false
Decoration      = true
Smoothing       = true
VSync           = true

[Physics]
Gravity         = (0, 1150, 0)
DimensionRatio  = 0.01

[Input]
SetList         = MainInput

[MainInput]
; Application control
KEY_ESCAPE      = Quit
JOY_BACK_1      = Quit
KEY_SPACE       = Pause
JOY_START_1     = Pause
KEY_R           = Restart
JOY_Y_1         = Restart
KEY_RETURN      = Confirm
JOY_A_1         = Confirm
KEY_H           = TakeScreenshot
JOY_LTHUMB_1    = TakeScreenshot

; Digital movement: keyboard + d-pad
KEY_LEFT        = MoveLeft
KEY_A           = MoveLeft
JOY_LEFT_1      = MoveLeft

KEY_RIGHT       = MoveRight
KEY_D           = MoveRight
JOY_RIGHT_1     = MoveRight

KEY_UP          = MoveUp
KEY_W           = MoveUp
JOY_UP_1        = MoveUp

KEY_DOWN        = MoveDown
KEY_S           = MoveDown
JOY_DOWN_1      = MoveDown

; Analog movement: left stick axes (values in -1.0..1.0)
JOY_LX_1        = MoveXAxis
JOY_LY_1        = MoveYAxis

[Screenshot]
Directory       = screenshots
BaseName        = rockrun-
Extension       = png

[Game]
LevelCount      = 3
Lives           = 3
TimeBonusPerSecond = 5
DiamondScore    = 100
DigScore        = 1

; ==========================================================================
; Viewports and cameras
; ==========================================================================

[MainViewport]
Camera          = MainCamera
BackgroundColor = (9, 7, 12)

[HudViewport]
Camera          = HudCamera

[MainCamera]
FrustumWidth    = 1280
FrustumHeight   = 720
FrustumFar      = 4
FrustumNear     = 0
Position        = (0, 0, -1)

[HudCamera]
; Set apart on the Z axis so that the game camera (at z=-1, looking
; forward) never picks up the HUD objects, only this camera does.
FrustumWidth    = 1280
FrustumHeight   = 720
FrustumFar      = 1.0
FrustumNear     = 0
Position        = (640, 360, -2)

; ==========================================================================
; Physics bodies
; ==========================================================================

; Physics design: static cells (dirt/wall) keep full-grid bodies forming a
; solid lattice, while everything dynamic (player, boulders, gems) gets a
; body slightly smaller than its cell so it never wedges between blocks.

[PlayerBody]
Dynamic         = true
FixedRotation   = true
AllowSleep      = false
LinearDamping   = 0.2
CustomGravity   = (0, 0, 0)
PartList        = PlayerPart

[PlayerPart]
Type            = box
Solid           = true
SelfFlags       = 0x0001
CheckMask       = 0xFFFF
Density         = 1.6
Friction        = 0.05
Restitution     = 0.0
TopLeft         = (-26.0, -26.0)
BottomRight     = (26.0, 26.0)

[BoulderBody]
Dynamic         = true
AllowSleep      = false
AngularDamping  = 0.4
LinearDamping   = 0.05
PartList        = BoulderPart

[BoulderPart]
; No explicit shape size: auto sphere radius from the object's own size,
; so all boulder variants (scale 0.36/0.5/0.68) get a physics sphere that
; matches their visual size.
Type            = sphere
Solid           = true
SelfFlags       = 0x0002
CheckMask       = 0xFFFF
Density         = 5.0
Friction        = 0.5
Restitution     = 0.18

[DiamondBody]
Dynamic         = true
AllowSleep      = false
AngularDamping  = 0.2
PartList        = DiamondPart # DiamondSensor

[DiamondPart]
Type            = box
Solid           = true
SelfFlags       = 0x0004
CheckMask       = 0xFFFE
Density         = 2.0
Friction        = 0.3
Restitution     = 0.45
TopLeft         = (-28.0, -28.0)
BottomRight     = (28.0, 28.0)

[DiamondSensor]
Type            = box
Solid           = false
SelfFlags       = 0x0040
CheckMask       = 0x0001
TopLeft         = (-33.0, -33.0)
BottomRight     = (33.0, 33.0)

; Two-tier subdivision: caves start as 32px sand blocks with a 2x2-tiled
; texture, and blocks near the player get replaced by four seamless 16px
; blocks - invisible visually, coarse-grained performance-wise until dug.

[SandBody32]
PartList        = SandPart32

[SandBody16]
PartList        = SandPart16

[SandPart32]
Type            = box
Solid           = true
SelfFlags       = 0x0008
CheckMask       = 0xFFFF
Density         = 1.0
Friction        = 0.7
Restitution     = 0.0

[SandPart16]
Type            = box
Solid           = true
SelfFlags       = 0x0008
CheckMask       = 0xFFFF
Density         = 1.0
Friction        = 0.7
Restitution     = 0.0

[WallBody]
PartList        = WallPart

[WallPart]
Type            = box
Solid           = true
SelfFlags       = 0x0010
CheckMask       = 0xFFFF
Density         = 1.0
Friction        = 0.6
Restitution     = 0.05

[ExitBody]
PartList        = ExitPart

[ExitPart]
Type            = box
Solid           = false
SelfFlags       = 0x0020
CheckMask       = 0x0001
TopLeft         = (-30.0, -30.0)
BottomRight     = (30.0, 30.0)

; Fireflies and butterflies: small wall-hugging creatures that move
; smoothly between cell centers (steered by creatures.nim), kill on
; touch and explode into diamonds when a boulder falls on them.

[CreatureBody]
Dynamic         = true
FixedRotation   = true
AllowSleep      = false
CustomGravity   = (0, 0, 0)
PartList        = CreaturePart

[CreaturePart]
Type            = sphere
Solid           = true
SelfFlags       = 0x0080
CheckMask       = 0xFFFF
Density         = 2.0
Friction        = 0.0
Restitution     = 0.0

; ==========================================================================
; Game objects
; ==========================================================================

[PlayerGraphic]
Texture         = player.png
Pivot           = center

[Player]
Graphic         = PlayerGraphic
Body            = PlayerBody
Scale           = 0.5
AnimSet         = PlayerAnimSet

; Animated hero: 13-frame strip (4 idle, 6 run, 3 dig/hit) from Kenney's
; Pixel Platformer adventurer, CC0. See data/ASSETS.md.
[PlayerAnimSet]
Animation       = Idle # 4 # Run # 6 # Dig # 3
StartAnim       = Idle
Texture         = hero.png
FrameSize       = (24, 24, 0)
KeyDuration     = 0.11
KeepInCache     = true

[Dig]
TextureOrigin   = (240, 0, 0)
KeyDuration     = 0.07
Animation->     = .Idle

[Run]
TextureOrigin   = (96, 0, 0)

[BoulderSmallGraphic]
Texture         = boulder_small.png
Pivot           = center

[BoulderGraphic]
Texture         = boulder.png
Pivot           = center

[BoulderBigGraphic]
Texture         = boulder_big.png
Pivot           = center

[BoulderSmall]
Graphic         = BoulderSmallGraphic
Body            = BoulderBody
Scale           = 0.36

[Boulder]
Graphic         = BoulderGraphic
Body            = BoulderBody
Scale           = 0.5

[BoulderBig]
Graphic         = BoulderBigGraphic
Body            = BoulderBody
Scale           = 0.68

[DiamondGraphic]
Texture         = diamond.png
Pivot           = center

[Diamond]
Graphic         = DiamondGraphic
Body            = DiamondBody
Scale           = 0.45

; Sand: two sizes sharing the same procedural texture; the 32px block
; tiles it 2x2 so a refinement swap is seamless.
[Sand32Graphic]
Texture         = dirt.png
Repeat          = (3, 3)
Pivot           = center

[SandFineGraphic]
Texture         = dirt.png
Pivot           = center

[Sand32]
Graphic         = Sand32Graphic
Body            = SandBody32
Scale           = 0.5
Color           = (235, 210, 175) ~ (255, 235, 205)

[SandFine]
Graphic         = SandFineGraphic
Body            = SandBody16
Scale           = 0.1667
Color           = (235, 210, 175) ~ (255, 235, 205)

[WallGraphic]
Texture         = wall.png
Pivot           = center

[Wall]
Graphic         = WallGraphic
Body            = WallBody
Scale           = 0.5

[ExitGraphic]
Texture         = exit.png
Pivot           = center

[Exit]
Graphic         = ExitGraphic
Body            = ExitBody
Scale           = 0.5
Color           = (150, 80, 50)

[FireflyGraphic]
Texture         = firefly.png
Pivot           = center

[Firefly]
Graphic         = FireflyGraphic
Body            = CreatureBody
Scale           = 0.25

[ButterflyGraphic]
Texture         = butterfly.png
Pivot           = center

[Butterfly]
Graphic         = ButterflyGraphic
Body            = CreatureBody
Scale           = 0.25

[AudioSource]
; Invisible object that owns the looping music.

; Short-lived dust effect spawned while digging.
[DustPuffGraphic]
Texture         = dirt.png
Pivot           = center

[DustPuff]
Graphic         = DustPuffGraphic
Scale           = 0.1 ~ 0.17
Color           = (160, 120, 75) ~ (220, 180, 120)
Speed           = (-60, -170, 0) ~ (60, -40, 0)
FX              = DustFade
LifeTime        = 0.55

; Sparkle burst on top of a collected diamond position.
[GemSparkleGraphic]
Texture         = diamond.png
Pivot           = center

[GemSparkle]
Graphic         = GemSparkleGraphic
Scale           = 0.06 ~ 0.12
Color           = (120, 255, 190, 255) ~ (90, 190, 255, 255)
Speed           = (-90, -160, 0) ~ (90, 40, 0)
FX              = DustFade
LifeTime        = 0.45

; ==========================================================================
; FX tracks
; ==========================================================================

[DustFade]
SlotList        = DustGrow # DustVanish
DoNotCache      = true

[DustGrow]
Type            = scale
Curve           = smooth
StartTime       = 0.0
EndTime         = 0.55
StartValue      = (1.0, 1.0, 1.0)
EndValue        = (2.2, 2.2, 1.0)

[DustVanish]
Type            = color
Curve           = smooth
StartTime       = 0.0
EndTime         = 0.55
Absolute        = false
StartValue      = (255, 255, 255, 255)
EndValue        = (0, 0, 0)

[CollectFlash]
SlotList        = CollectTint # CollectBurst
DoNotCache      = true

[CollectTint]
Type            = color
Curve           = sine
StartTime       = 0.0
EndTime         = 0.25
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (140, 255, 190)

[CollectBurst]
Type            = scale
Curve           = sine
StartTime       = 0.0
EndTime         = 0.25
StartValue      = (1.0, 1.0, 1.0)
EndValue        = (1.3, 1.3, 1.0)

[HitFlash]
SlotList        = HitTint
DoNotCache      = true

[HitTint]
Type            = color
Curve           = sine
StartTime       = 0.0
EndTime         = 0.3
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (255, 70, 60)

[SparkleFX]
SlotList        = SparkleTint
KeepLooping     = true

[SparkleTint]
Type            = color
Curve           = sine
Period          = 1.4
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (150, 205, 255)

[ExitOpenFX]
SlotList        = ExitGlowTint
KeepLooping     = true

[ExitGlowTint]
Type            = color
Curve           = sine
Period          = 0.9
Absolute        = true
StartValue      = (110, 255, 110)
EndValue        = (190, 255, 140)

; ==========================================================================
; Sounds and music
; ==========================================================================

[DigSound]
Sound           = dig.ogg
KeepInCache     = true
Volume          = 0.35
Pitch           = 0.9 ~ 1.1

[PushSound]
Sound           = push.ogg
KeepInCache     = true
Volume          = 0.4
Pitch           = 0.85 ~ 1.05

[LandSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.32
Pitch           = 0.8 ~ 1.1

[ClinkSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.18
Pitch           = 1.7 ~ 2.1

[CollectSound]
Sound           = collect.ogg
KeepInCache     = true
Volume          = 0.55
Pitch           = 0.95 ~ 1.15

[WinSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.65

[LoseSound]
Sound           = lose.ogg
KeepInCache     = true
Volume          = 0.55

[ExitOpenSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.45
Pitch           = 1.5

[GameMusic]
Music           = rockrun_theme.ogg
Loop            = true
Volume          = 0.45

; ==========================================================================
; Fonts
; ==========================================================================

[GameFont]
Typeface        = pressstart2p.ttf
CharacterSize   = 32
CharacterList   = ASCII
SDF             = true
KeepInCache     = true

; ==========================================================================
; HUD (second viewport, screen aligned)
; ==========================================================================

[HudScore]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
String          = SCORE 0
Position        = (20, 18, -1.5)
Scale           = 0.8
Color           = (235, 240, 255)

[HudDiamonds]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
String          = GEMS 0/0
Position        = (350, 18, -1.5)
Scale           = 0.8
Color           = (140, 255, 190)

[HudTime]
Graphic         = @
Text            = @
