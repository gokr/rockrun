; Rockrun - main ORX configuration
; Physics-driven Boulder Dash successor.

[Display]
Title           = Rockrun
ScreenWidth     = 960
ScreenHeight    = 540
FullScreen      = false
Decoration      = true
Smoothing       = true
VSync           = true

[Physics]
Gravity         = (0, 1150, 0)
DimensionRatio  = 0.01

[Input]
SetList         = MainInput

[MainInput]
; Application control
KEY_ESCAPE      = Quit
JOY_BACK_1      = Quit
KEY_SPACE       = Pause
JOY_START_1     = Pause
KEY_R           = Restart
JOY_Y_1         = Restart
KEY_RETURN      = Confirm
JOY_A_1         = Confirm
KEY_H           = TakeScreenshot
JOY_LTHUMB_1    = TakeScreenshot

; Digital movement: keyboard + d-pad
KEY_LEFT        = MoveLeft
KEY_A           = MoveLeft
JOY_LEFT_1      = MoveLeft

KEY_RIGHT       = MoveRight
KEY_D           = MoveRight
JOY_RIGHT_1     = MoveRight

KEY_UP          = MoveUp
KEY_W           = MoveUp
JOY_UP_1        = MoveUp

KEY_DOWN        = MoveDown
KEY_S           = MoveDown
JOY_DOWN_1      = MoveDown

; Analog movement: left stick axes (values in -1.0..1.0)
JOY_LX_1        = MoveXAxis
JOY_LY_1        = MoveYAxis

[Screenshot]
Directory       = screenshots
BaseName        = rockrun-
Extension       = png

[Game]
LevelCount      = 3
Lives           = 3
TimeBonusPerSecond = 5
DiamondScore    = 100
DigScore        = 2

; ==========================================================================
; Viewports and cameras
; ==========================================================================

[MainViewport]
Camera          = MainCamera
BackgroundColor = (9, 7, 12)

[HudViewport]
Camera          = HudCamera

[MainCamera]
FrustumWidth    = 960
FrustumHeight   = 540
FrustumFar      = 4
FrustumNear     = 0
Position        = (0, 0, -1)

[HudCamera]
; Set apart on the Z axis so that the game camera (at z=-1, looking
; forward) never picks up the HUD objects, only this camera does.
FrustumWidth    = 960
FrustumHeight   = 540
FrustumFar      = 1.0
FrustumNear     = 0
Position        = (480, 270, -2)

; ==========================================================================
; Physics bodies
; ==========================================================================

; Physics design: static cells (dirt/wall) keep full-grid bodies forming a
; solid lattice, while everything dynamic (player, boulders, gems) gets a
; body slightly smaller than its cell so it never wedges between blocks.

[PlayerBody]
Dynamic         = true
FixedRotation   = true
AllowSleep      = false
LinearDamping   = 0.2
CustomGravity   = (0, 0, 0)
PartList        = PlayerPart

[PlayerPart]
Type            = box
Solid           = true
SelfFlags       = 0x0001
CheckMask       = 0xFFFF
Density         = 1.6
Friction        = 0.05
Restitution     = 0.0
TopLeft         = (-13.0, -13.0)
BottomRight     = (13.0, 13.0)

[BoulderBody]
Dynamic         = true
AllowSleep      = false
AngularDamping  = 0.4
LinearDamping   = 0.05
PartList        = BoulderPart

[BoulderPart]
Type            = sphere
Solid           = true
SelfFlags       = 0x0002
CheckMask       = 0xFFFF
Density         = 5.0
Friction        = 0.5
Restitution     = 0.18
Center          = (0.0, 0.0)
Radius          = 13.5

[DiamondBody]
Dynamic         = true
AllowSleep      = false
AngularDamping  = 0.2
PartList        = DiamondPart # DiamondSensor

[DiamondPart]
Type            = box
Solid           = true
SelfFlags       = 0x0004
CheckMask       = 0xFFFE
Density         = 2.0
Friction        = 0.3
Restitution     = 0.45
TopLeft         = (-11.0, -11.0)
BottomRight     = (11.0, 11.0)

[DiamondSensor]
Type            = box
Solid           = false
SelfFlags       = 0x0040
CheckMask       = 0x0001
TopLeft         = (-14.0, -14.0)
BottomRight     = (14.0, 14.0)

[DirtBody]
PartList        = DirtPart

[DirtPart]
Type            = box
Solid           = true
SelfFlags       = 0x0008
CheckMask       = 0xFFFF
Density         = 1.0
Friction        = 0.7
Restitution     = 0.0

[WallBody]
PartList        = WallPart

[WallPart]
Type            = box
Solid           = true
SelfFlags       = 0x0010
CheckMask       = 0xFFFF
Density         = 1.0
Friction        = 0.6
Restitution     = 0.05

[ExitBody]
PartList        = ExitPart

[ExitPart]
Type            = box
Solid           = false
SelfFlags       = 0x0020
CheckMask       = 0x0001
TopLeft         = (-15.0, -15.0)
BottomRight     = (15.0, 15.0)

; ==========================================================================
; Game objects
; ==========================================================================

[PlayerGraphic]
Texture         = player.png
Pivot           = center

[Player]
Graphic         = PlayerGraphic
Body            = PlayerBody
Scale           = 0.47

[BoulderGraphic]
Texture         = boulder.png
Pivot           = center

[Boulder]
Graphic         = BoulderGraphic
Body            = BoulderBody
Scale           = 0.48 ~ 0.52

[DiamondGraphic]
Texture         = diamond.png
Pivot           = center

[Diamond]
Graphic         = DiamondGraphic
Body            = DiamondBody
Scale           = 0.46 ~ 0.52

[DirtGraphic]
Texture         = dirt.png
Pivot           = center

[Dirt]
Graphic         = DirtGraphic
Body            = DirtBody
Scale           = 0.5
; Subtle visual variance so the cave doesn't read as a perfect matrix.
Rotation        = -3.0 ~ 3.0
Color           = (235, 215, 190) ~ (255, 240, 215)

[WallGraphic]
Texture         = wall.png
Pivot           = center

[Wall]
Graphic         = WallGraphic
Body            = WallBody
Scale           = 0.5

[ExitGraphic]
Texture         = exit.png
Pivot           = center

[Exit]
Graphic         = ExitGraphic
Body            = ExitBody
Scale           = 0.5
Color           = (150, 80, 50)

[AudioSource]
; Invisible object that owns the looping music.

; Short-lived dust effect spawned while digging.
[DustPuffGraphic]
Texture         = dirt.png
Pivot           = center

[DustPuff]
Graphic         = DustPuffGraphic
Scale           = 0.1 ~ 0.17
Color           = (160, 120, 75) ~ (220, 180, 120)
Speed           = (-60, -170, 0) ~ (60, -40, 0)
FX              = DustFade
LifeTime        = 0.55

; Sparkle burst on top of a collected diamond position.
[GemSparkleGraphic]
Texture         = diamond.png
Pivot           = center

[GemSparkle]
Graphic         = GemSparkleGraphic
Scale           = 0.06 ~ 0.12
Color           = (120, 255, 190, 255) ~ (90, 190, 255, 255)
Speed           = (-90, -160, 0) ~ (90, 40, 0)
FX              = DustFade
LifeTime        = 0.45

; ==========================================================================
; FX tracks
; ==========================================================================

[DustFade]
SlotList        = DustGrow # DustVanish
DoNotCache      = true

[DustGrow]
Type            = scale
Curve           = smooth
StartTime       = 0.0
EndTime         = 0.55
StartValue      = (1.0, 1.0, 1.0)
EndValue        = (2.2, 2.2, 1.0)

[DustVanish]
Type            = color
Curve           = smooth
StartTime       = 0.0
EndTime         = 0.55
Absolute        = false
StartValue      = (255, 255, 255, 255)
EndValue        = (0, 0, 0)

[CollectFlash]
SlotList        = CollectTint # CollectBurst
DoNotCache      = true

[CollectTint]
Type            = color
Curve           = sine
StartTime       = 0.0
EndTime         = 0.25
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (140, 255, 190)

[CollectBurst]
Type            = scale
Curve           = sine
StartTime       = 0.0
EndTime         = 0.25
StartValue      = (1.0, 1.0, 1.0)
EndValue        = (1.3, 1.3, 1.0)

[HitFlash]
SlotList        = HitTint
DoNotCache      = true

[HitTint]
Type            = color
Curve           = sine
StartTime       = 0.0
EndTime         = 0.3
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (255, 70, 60)

[SparkleFX]
SlotList        = SparkleTint
KeepLooping     = true

[SparkleTint]
Type            = color
Curve           = sine
Period          = 1.4
Absolute        = true
StartValue      = (255, 255, 255)
EndValue        = (150, 205, 255)

[ExitOpenFX]
SlotList        = ExitGlowTint
KeepLooping     = true

[ExitGlowTint]
Type            = color
Curve           = sine
Period          = 0.9
Absolute        = true
StartValue      = (110, 255, 110)
EndValue        = (190, 255, 140)

; ==========================================================================
; Sounds and music
; ==========================================================================

[DigSound]
Sound           = dig.ogg
KeepInCache     = true
Volume          = 0.35
Pitch           = 0.9 ~ 1.1

[PushSound]
Sound           = push.ogg
KeepInCache     = true
Volume          = 0.4
Pitch           = 0.85 ~ 1.05

[LandSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.32
Pitch           = 0.8 ~ 1.1

[ClinkSound]
Sound           = land.ogg
KeepInCache     = true
Volume          = 0.18
Pitch           = 1.7 ~ 2.1

[CollectSound]
Sound           = collect.ogg
KeepInCache     = true
Volume          = 0.55
Pitch           = 0.95 ~ 1.15

[WinSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.65

[LoseSound]
Sound           = lose.ogg
KeepInCache     = true
Volume          = 0.55

[ExitOpenSound]
Sound           = win.ogg
KeepInCache     = true
Volume          = 0.45
Pitch           = 1.5

[GameMusic]
Music           = rockrun_theme.ogg
Loop            = true
Volume          = 0.45

; ==========================================================================
; HUD (second viewport, screen aligned)
; ==========================================================================

[HudScore]
Graphic         = @
Text            = @
Locale          = false
String          = SCORE 0
Position        = (16, 14, -1.5)
Scale           = 0.75
Color           = (235, 240, 255)

[HudDiamonds]
Graphic         = @
Text            = @
Locale          = false
String          = GEMS 0/0
Position        = (290, 14, -1.5)
Scale           = 0.75
Color           = (140, 255, 190)

[HudTime]
Graphic         = @
Text            = @
Locale          = false
String          = TIME 0
Position        = (520, 14, -1.5)
Scale           = 0.75
Color           = (235, 240, 255)

[HudLives]
Graphic         = @
Text            = @
Locale          = false
String          = LIVES 3
Position        = (760, 14, -1.5)
Scale           = 0.75
Color           = (255, 170, 90)

[HudLevel]
Graphic         = @
Text            = @
Locale          = false
String          = CAVE 1
Position        = (16, 36, -1.5)
Scale           = 0.55
Color           = (150, 165, 195)

[HudHint]
Graphic         = @
Text            = @
Locale          = false
String          = "Move: WASD/arrows/d-pad/stick  Space/Start: pause  R/Y: retry  Esc/Back: quit"
Position        = (16, 516, -1.5)
Scale           = 0.45
Color           = (120, 130, 150)

[LevelMessage]
Graphic         = @
Text            = @
Locale          = false
String          = Ready
Position        = (480, 200, -1.5)
Pivot           = center
Scale           = 1.4
Color           = (255, 225, 90)

[SubMessage]
Graphic         = @
Text            = @
Locale          = false
String          = ""
Position        = (480, 250, -1.5)
Pivot           = center
Scale           = 0.7
Color           = (215, 225, 245)

@levels.ini@
