[LevelMessage]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
String          = Ready
Position        = (640, 290, -1.5)
Pivot           = center
Scale           = 1.5
Color           = (255, 225, 90)

[SubMessage]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
String          = ""
Position        = (640, 380, -1.5)
Pivot           = center
Scale           = 0.75
Color           = (215, 225, 245)

@levels.ini@
