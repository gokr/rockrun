Position        = (640, 18, -1.5)
Scale           = 0.8
Color           = (235, 240, 255)

[HudLives]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
String          = LIVES 3
Position        = (1000, 18, -1.5)
Scale           = 0.8
Color           = (255, 170, 90)

[HudLevel]
Graphic         = @
Text            = @
Font            = GameFont
Locale          = false
